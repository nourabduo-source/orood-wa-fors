
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10243a">
  <title>عروض وفرص | أفضل المنتجات</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }
    header {
      background: #10243a;
      color: white;
      padding: 28px 16px;
      text-align: center;
    }
    header h1 { margin: 0 0 10px; font-size: 30px; }
    header p { margin: 0; color: #d4e5f6; line-height: 1.8; }
    main { max-width: 1100px; margin: auto; padding: 20px 14px; }
    .search {
      display: block;
      width: 100%;
      padding: 14px;
      border: 1px solid #d5dce6;
      border-radius: 12px;
      font-size: 16px;
      background: white;
      margin-bottom: 20px;
    }
    .status {
      text-align: center;
      padding: 24px 10px;
      color: #536174;
      line-height: 1.9;
    }
    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }
    .product {
      background: white;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 3px 14px #182b4510;
      border: 1px solid #e7ecf2;
      display: flex;
      flex-direction: column;
    }
    .product img {
      width: 100%;
      height: 220px;
      object-fit: contain;
      background: white;
    }
    .product-content {
      padding: 15px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .product h2 { font-size: 18px; margin: 0 0 10px; }
    .price {
      font-size: 19px;
      font-weight: bold;
      color: #087f5b;
      margin-bottom: 10px;
    }
    .description {
      font-size: 14px;
      line-height: 1.8;
      color: #536174;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      flex: 1;
    }
    .buy {
      display: block;
      text-align: center;
      background: #087f5b;
      color: white;
      text-decoration: none;
      border-radius: 9px;
      padding: 12px;
      margin-top: 15px;
      font-weight: bold;
    }
    .buy:hover { background: #066b4c; }
    footer {
      text-align: center;
      padding: 24px 12px;
      color: #64748b;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <header>
    <h1>عروض وفرص</h1>
    <p>اكتشف أفضل المنتجات والعروض في مكان واحد</p>
  </header>

  <main>
    <input
      id="search"
      class="search"
      type="search"
      placeholder="ابحث عن منتج..."
      aria-label="ابحث عن منتج"
    >

    <div id="status" class="status">جارٍ تحميل المنتجات...</div>
    <section id="products" class="products"></section>
  </main>

  <footer>
    عروض وفرص — اكتشف المنتج المناسب لك.
    قد نحصل على عمولة عند الشراء من بعض الروابط.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // بيانات الاتصال العامة بمشروع عروض وفرص فقط.
    // لا تضع هنا أي Secret Key أو service_role key.
    const SUPABASE_URL =
      "https://xlpaawabcnwdjfifahzs.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_4KPZkv0RhC4E3TVMgRerZg_aPFSxrzd";

    const statusBox = document.getElementById("status");
    const productsBox = document.getElementById("products");
    const searchBox = document.getElementById("search");

    let allProducts = [];

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    function addText(parent, tag, className, value) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      element.textContent = value == null ? "" : String(value);
      parent.appendChild(element);
      return element;
    }

    function validWebUrl(value) {
      try {
        const url = new URL(value);
        return url.protocol === "https:" || url.protocol === "http:";
      } catch {
        return false;
      }
    }

    function renderProducts() {
      const term = searchBox.value.trim().toLocaleLowerCase("ar");
      productsBox.replaceChildren();

      const filtered = allProducts.filter(product =>
        [product.name, product.description]
          .some(value =>
            String(value || "").toLocaleLowerCase("ar").includes(term)
          )
      );

      if (!filtered.length) {
        statusBox.textContent = allProducts.length
          ? "لا توجد منتجات تطابق بحثك."
          : "لا توجد منتجات منشورة حاليًا. ستظهر المنتجات هنا بعد إضافتها إلى قاعدة البيانات.";
        statusBox.hidden = false;
        return;
      }

      statusBox.hidden = true;

      filtered.forEach(product => {
        const card = document.createElement("article");
        card.className = "product";

        if (product.image_url && validWebUrl(product.image_url)) {
          const image = document.createElement("img");
          image.src = product.image_url;
          image.alt = product.name || "صورة المنتج";
          image.loading = "lazy";
          image.onerror = () => image.remove();
          card.appendChild(image);
        }

        const content = document.createElement("div");
        content.className = "product-content";

        addText(content, "h2", "", product.name || "منتج");

        if (product.price !== null && product.price !== undefined) {
          addText(content, "div", "price", `${product.price} `);
        }

        addText(
          content,
          "p",
          "description",
          product.description || "اكتشف تفاصيل المنتج."
        );

        if (validWebUrl(product.affiliate_url || "")) {
          const buy = document.createElement("a");
          buy.className = "buy";
          buy.href = product.affiliate_url;
          buy.target = "_blank";
          buy.rel = "noopener noreferrer sponsored";
          buy.textContent = "عرض المنتج والشراء";
          content.appendChild(buy);
        }

        card.appendChild(content);
        productsBox.appendChild(card);
      });
    }

    async function loadProducts() {
      statusBox.hidden = false;
      statusBox.textContent = "جارٍ تحميل المنتجات...";

      const { data, error } = await supabaseClient
        .from("products")
        .select("id,name,price,image_url,description,affiliate_url,created_at")
        .eq("is_published", true)
        .order("created_at", { ascending: false });

      if (error) {
        console.error("Supabase error:", error);
        statusBox.textContent =
          "تعذر تحميل المنتجات. تأكد من اتصال قاعدة البيانات وسياسات القراءة.";
        return;
      }

      allProducts = data || [];
      renderProducts();
    }

    searchBox.addEventListener("input", renderProducts);

    loadProducts();
  </script>
</body>
</html>
