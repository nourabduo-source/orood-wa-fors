
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>دخول المدير | عروض وفرص</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #f1f5f9;
      font-family: Arial, sans-serif;
    }
    .login {
      width: 100%;
      max-width: 390px;
      padding: 28px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 30px #00000012;
    }
    h1 { color: #087e8b; text-align: center; }
    p { color: #64748b; text-align: center; }
    label { display: block; margin: 16px 0 7px; }
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 13px;
      margin-top: 20px;
      background: #087e8b;
      color: white;
      border: 0;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    #message { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main class="login">
    <h1>عروض وفرص</h1>
    <p>تسجيل دخول المدير</p>

    <form id="loginForm">
      <label for="email">البريد الإلكتروني</label>
      <input id="email" type="email" required
             autocomplete="username" placeholder="البريد الإلكتروني">

      <label for="password">كلمة المرور</label>
      <input id="password" type="password" required
             autocomplete="current-password" placeholder="كلمة المرور">

      <button id="loginButton" type="submit">تسجيل الدخول</button>
    </form>

    <p id="message" role="status"></p>
  </main>

  <script>
    const SUPABASE_URL = "https://xlpaawabcnwdjfifahzs.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_4KPZkv0RhC4E3TVMgRerZg_aPFSxrzd";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const button = document.getElementById("loginButton");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();
      button.disabled = true;
      message.textContent = "جارٍ التحقق من بيانات الدخول...";

      try {
        const { error } = await client.auth.signInWithPassword({
          email: document.getElementById("email").value.trim(),
          password: document.getElementById("password").value
        });

        if (error) throw error;

        message.textContent =
          "تم تسجيل الدخول بنجاح. لوحة إدارة المنتجات تحتاج إلى إعداد الخطوة التالية.";
      } catch (error) {
        message.textContent = "تعذر تسجيل الدخول. تحقق من البريد وكلمة المرور.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
