<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>عروض وفرص — أفضل المنتجات والعروض</title>
<meta name="description" content="اكتشف أفضل المنتجات والعروض في مكان واحد">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f7fa;color:#243047;font-family:Arial,sans-serif}
header{background:#087e8b;color:white;padding:25px 16px;text-align:center}
header h1{margin:0 0 10px}
header p{margin:0}
main{max-width:1000px;margin:20px auto;padding:0 14px}
.search{width:100%;padding:14px;border:1px solid #ccd5df;border-radius:10px;font-size:16px;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.card{background:white;border-radius:12px;padding:16px;box-shadow:0 3px 12px #0000000c;display:flex;flex-direction:column}
.card img{width:100%;height:190px;object-fit:contain;border-radius:8px}
.card h2{font-size:19px;margin:12px 0}
.price{font-weight:bold;color:#087e8b;font-size:19px}
.description{line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}
.buy{display:block;text-align:center;background:#087e8b;color:white;text-decoration:none;padding:12px;border-radius:8px;margin-top:auto}
.message{text-align:center;padding:22px;line-height:1.8}
footer{text-align:center;padding:20px;color:#64748b;font-size:13px}
</style>
</head>
<body>
<header>
<h1>عروض وفرص</h1>
<p>اكتشف أفضل المنتجات والعروض في مكان واحد</p>
</header>

<main>
<input id="search" class="search" type="search" placeholder="ابحث عن منتج...">
<div id="message" class="message">جارٍ تحميل المنتجات...</div>
<div id="products" class="grid"></div>
</main>

<footer>
عروض وفرص — اكتشف المنتج المناسب لك.
قد نحصل على عمولة عند الشراء من بعض الروابط.
</footer>

<script>
const SUPABASE_URL="https://xlpaawabcnwdjfifahzs.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_4KPZkv0RhC4E3TVMgRerZg_aPFSxrzd";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);

const productsBox=document.getElementById("products");
const message=document.getElementById("message");
const search=document.getElementById("search");
let products=[];

function renderProducts(){
  productsBox.replaceChildren();
  const term=search.value.trim().toLowerCase();
  const filtered=products.filter(p=>
    (p.name||"").toLowerCase().includes(term)||
    (p.description||"").toLowerCase().includes(term)
  );

  if(!filtered.length){
    message.textContent=products.length
      ?"لا توجد منتجات تطابق بحثك."
      :"لا توجد منتجات منشورة حاليًا.";
    message.hidden=false;
    return;
  }

  message.hidden=true;

  filtered.forEach(p=>{
    const card=document.createElement("article");
    card.className="card";

    if(p.image_url){
      const img=document.createElement("img");
      img.src=p.image_url;
      img.alt=p.name||"صورة المنتج";
      img.loading="lazy";
      img.onerror=()=>img.remove();
      card.appendChild(img);
    }

    const title=document.createElement("h2");
    title.textContent=p.name||"منتج";
    card.appendChild(title);

    const price=document.createElement("div");
    price.className="price";
    price.textContent=p.price==null?"السعر عند فتح المنتج":"السعر: "+p.price;
    card.appendChild(price);

    if(p.description){
      const desc=document.createElement("p");
      desc.className="description";
      desc.textContent=p.description;
      card.appendChild(desc);
    }

    if(p.affiliate_url){
      const link=document.createElement("a");
      link.className="buy";
      link.href=p.affiliate_url;
      link.target="_blank";
      link.rel="noopener noreferrer sponsored";
      link.textContent="عرض المنتج والشراء";
      card.appendChild(link);
    }

    productsBox.appendChild(card);
  });
}

async function loadProducts(){
  try{
    const {data,error}=await db
      .from("products")
      .select("id,name,price,image_url,description,affiliate_url")
      .order("id",{ascending:false});

    if(error) throw error;
    products=data||[];
    renderProducts();
  }catch(error){
    message.hidden=false;
    message.textContent="تعذر تحميل المنتجات. يجب السماح للزوار بقراءة المنتجات من إعدادات الأمان في Supabase.";
  }
}

search.addEventListener("input",renderProducts);
loadProducts();
</script>
</body>
</html>
